name: 🐛 Bug 报告
description: 报告代码运行中的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整，方便快速定位问题。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 你做了什么、期望发生什么、实际发生了什么？
      placeholder: |
        运行 `python src/predict.py --image xx.jpg` 时，报错 ...
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: 复现命令
      placeholder: python src/predict.py --image test.jpg

  - type: textarea
    id: traceback
    attributes:
      label: 完整报错信息
      render: shell

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Python / PyTorch 版本
      placeholder: 如 Python 3.11 / torch 2.4.0+cu121
